name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Windows — Inno Setup Installer ──────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build Windows
        run: wails build -platform windows/amd64

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Create Inno Setup script
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $version) { $version = "0.1.0" }
          @"
          [Setup]
          AppName=Crafting Editor
          AppVersion=$version
          AppPublisher=Otaku17
          DefaultDirName={autopf}\CraftingEditor
          DefaultGroupName=Crafting Editor
          OutputDir=build\installer
          OutputBaseFilename=CraftingEditor-Setup
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64

          [Files]
          Source: "build\bin\CraftingEditor.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\Crafting Editor"; Filename: "{app}\CraftingEditor.exe"
          Name: "{commondesktop}\Crafting Editor"; Filename: "{app}\CraftingEditor.exe"

          [Run]
          Filename: "{app}\CraftingEditor.exe"; Description: "Launch Crafting Editor"; Flags: nowait postinstall skipifsilent
          "@ | Out-File -FilePath setup.iss -Encoding UTF8

      - name: Build installer
        run: |
          mkdir -p build\installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/installer/CraftingEditor-Setup.exe

  # ── macOS — DMG ───────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Install frontend deps
        working-directory: frontend
        run: npm install
      - name: Build macOS Universal
        run: wails build -platform darwin/universal
      - name: Create DMG
        run: |
          APP=$(find build/bin -maxdepth 1 -name "*.app" -type d | head -1)
          echo "Packaging: $APP"
          mkdir -p dmg-staging
          cp -R "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create \
            -volname "Crafting Editor" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            build/bin/CraftingEditor.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/bin/CraftingEditor.dmg

  # ── Linux — AppImage ──────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Linux deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            build-essential pkg-config libglib2.0-dev \
            fuse libfuse2
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Install frontend deps
        working-directory: frontend
        run: npm install
      - name: Build Linux
        run: wails build -platform linux/amd64
      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool
      - name: Find binary name
        id: binname
        run: |
          BIN=$(find build/bin -maxdepth 1 -type f | head -1 | xargs basename)
          echo "BIN=$BIN" >> $GITHUB_OUTPUT
      - name: Create AppDir structure
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/bin/${{ steps.binname.outputs.BIN }} AppDir/usr/bin/CraftingEditor
          cp build/appicon.png AppDir/usr/share/icons/hicolor/256x256/apps/crafting-editor.png
          cp build/appicon.png AppDir/crafting-editor.png
          cat > AppDir/crafting-editor.desktop << 'EOF'
          [Desktop Entry]
          Name=Crafting Editor
          Exec=CraftingEditor
          Icon=crafting-editor
          Type=Application
          Categories=Utility;Development;
          EOF
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          APPDIR="$(dirname "$(readlink -f "$0")")"
          exec "$APPDIR/usr/bin/CraftingEditor" "$@"
          EOF
          chmod +x AppDir/AppRun
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: ARCH=x86_64 appimagetool AppDir build/bin/CraftingEditor-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/bin/CraftingEditor-x86_64.AppImage

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      - name: Update version.json
        run: |
          echo "{\"version\": \"${{ steps.version.outputs.VERSION }}\"}" > docs/version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/version.json
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION }}"
          git push origin HEAD:main || true
      - name: List artifacts
        run: find artifacts/ -type f
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: 'Crafting Editor ${{ steps.version.outputs.VERSION }}'
          body: |
            ## Crafting Editor ${{ steps.version.outputs.VERSION }}

            | Platform | Download | Notes |
            |---|---|---|
            | 🪟 Windows | `CraftingEditor-Setup.exe` | Installer — adds to Start Menu |
            | 🍎 macOS | `CraftingEditor.dmg` | Universal (Intel + Apple Silicon) |
            | 🐧 Linux | `CraftingEditor-x86_64.AppImage` | No install needed |

            > **Windows:** click *More info* → *Run anyway*
            > **macOS:** `xattr -cr /Applications/CraftingEditor.app` or right-click → Open
            > **Linux:** `chmod +x CraftingEditor-x86_64.AppImage && ./CraftingEditor-x86_64.AppImage`
          files: |
            artifacts/windows-build/CraftingEditor-Setup.exe
            artifacts/macos-build/CraftingEditor.dmg
            artifacts/linux-build/CraftingEditor-x86_64.AppImage
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'alpha') }}
