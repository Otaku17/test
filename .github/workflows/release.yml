name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Windows ──────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Install frontend deps
        working-directory: frontend
        run: npm install
      - name: Build Windows
        run: wails build -platform windows/amd64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/bin/*.exe

  # ── macOS ─────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Install frontend deps
        working-directory: frontend
        run: npm install
      - name: Build macOS
        run: wails build -platform darwin/universal
      - name: Zip .app (quel que soit le nom généré)
        run: |
          cd build/bin
          APP=$(ls -d *.app | head -1)
          echo "Found app: $APP"
          zip -r CraftingEditor-mac.zip "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/bin/CraftingEditor-mac.zip

  # ── Linux ─────────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Linux deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            build-essential \
            pkg-config \
            libglib2.0-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Install frontend deps
        working-directory: frontend
        run: npm install
      - name: Build Linux
        run: wails build -platform linux/amd64
      - name: Rename binary
        run: mv build/bin/$(ls build/bin/) build/bin/CraftingEditor-linux || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/bin/CraftingEditor-linux

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      - name: Update version.json
        run: |
          echo "{\"version\": \"${{ steps.version.outputs.VERSION }}\"}" > docs/version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/version.json
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION }}"
          git push origin HEAD:main || true
      - name: List artifacts
        run: find artifacts/ -type f
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Crafting Editor ${{ steps.version.outputs.VERSION }}"
          body: |
            ## Crafting Editor ${{ steps.version.outputs.VERSION }}

            | Platform | Download |
            |---|---|
            | 🪟 Windows | `.exe` |
            | 🍎 macOS | `CraftingEditor-mac.zip` |
            | 🐧 Linux | `CraftingEditor-linux` |

            > **Windows:** click *More info* → *Run anyway*
            > **macOS:** `xattr -cr /Applications/CraftingEditor.app` or right-click → Open
          files: |
            artifacts/windows-build/*.exe
            artifacts/macos-build/CraftingEditor-mac.zip
            artifacts/linux-build/CraftingEditor-linux
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'alpha') }}
